name: flutter_app_med
description: "MediCare - Medication Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  sensors_plus: ^5.0.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  http: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  image_picker: ^1.1.2
  
  
  # ✅ Your friend's dependencies
  mobile_scanner: ^7.2.0
  permission_handler: ^11.3.1
  
  # ✅ YOUR Firebase dependencies (push notifications)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  firebase_core_web: ^2.24.1
  
    # ← Ajoute cette ligne
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  open_file: ^3.3.2
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Voice messages (chat)
  record: 6.2.0 # pinned exact — 6.2.1 pulls record_platform_interface 1.6.0, which has a breaking change not yet supported by record_linux/record_android/record_windows
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

# record_platform_interface 1.6.0 has a breaking interface change that
# record_android/record_linux/record_windows weren't updated for yet, even
# though their own caret constraints (^1.4.0 / ^1.5.0) technically permit it.
# Force the last known-good interface version until the whole record_* family
# is bumped together to the v2 line (which also needs Dart SDK >=3.12).
dependency_overrides:
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"